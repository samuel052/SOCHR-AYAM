# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: general_ship_damage      # מנגנון הנזק הכללי (סערה/שרטון/נזק-מוחמר)
    status: active
    source: design/gdd/sailing-engine.md
    referenced_by:
      - design/gdd/sailing-engine.md
      - design/gdd/ship-damage-repair.md
    variables: [cash, cargo_value, damage]
    output_range: [75, 999999]
    expression: "dmg=5*trunc((cash+cargo_value)/(rand(100)+200)); dmg=max(dmg,75); if damage>0: dmg+=trunc(dmg/3); dmg=5*trunc(dmg/5)"
    notes: "ללא בנק. מינימום 75 לתקינה, 100 מעשי לפגועה."
    added: 2026-07-07
    revised: ""
  - name: total_wealth             # הון כולל לאירועי בוקר
    status: active
    source: design/gdd/morning-events.md
    referenced_by:
      - design/gdd/morning-events.md
      - design/gdd/banking.md
    variables: [cash, cargo_value]
    output_range: [0, 999999]
    expression: "cash + cargo_value(current_port)"
    notes: "ללא יתרת בנק — במפורש."
    added: 2026-07-07
    revised: ""
  - name: cargo_loss_pct           # אובדן מטען (סערה / גניבת סחורה)
    status: active
    source: design/gdd/sailing-engine.md
    referenced_by:
      - design/gdd/sailing-engine.md
      - design/gdd/morning-events.md
    variables: [qty]
    output_range: [1, 999999]
    expression: "clamp(trunc(qty*(4*rand(21))/100), 1, qty)"
    notes: "0%-80% בקפיצות 4%; אותה נוסחה בסערת מטען ובגניבת לילה."
    added: 2026-07-07
    revised: ""

