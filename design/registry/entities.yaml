    unit: tons
    added: 2026-07-07
    revised: ""
  - name: sail_block_damage
    status: active
    source: design/gdd/ship-damage-repair.md
    referenced_by:
      - design/gdd/time-calendar.md
      - design/gdd/sailing-engine.md
    value: 1000
    unit: shekel
