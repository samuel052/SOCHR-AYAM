    price_step: 100
    pirate_fixed_value: 3000   # ערך קבוע בפשרת פיראטים (pirates.md)
    scan_order: 1              # סדר סריקה קבוע במקור
    added: 2026-07-07
    revised: ""
  - name: olives             # זיתים
    status: active
